<template>
    <lightning-card title="Property Management">

        <!-- ================= LIST VIEW ================= -->
        <template if:false={showCreateForm}>

            <!-- Filters -->
            <div class="slds-p-around_medium">

                <lightning-input type="number" label="Min Price"
                    value={minPrice} onchange={handleMinPrice}>
                </lightning-input>

                <lightning-input type="number" label="Max Price"
                    value={maxPrice} onchange={handleMaxPrice}>
                </lightning-input>

                <lightning-combobox
                    label="Status"
                    options={statusOptions}
                    value={status}
                    onchange={handleStatus}>
                </lightning-combobox>

                <lightning-combobox
                    label="Furnishing"
                    options={furnishingOptions}
                    value={furnishing}
                    onchange={handleFurnishing}>
                </lightning-combobox>

                <div class="slds-m-top_small">
                    <lightning-button label="Search" variant="brand" onclick={handleSearch}></lightning-button>
                    <lightning-button label="Refresh" onclick={handleRefresh} class="slds-m-left_small"></lightning-button>
                    <lightning-button label="Create Property" variant="brand" onclick={openCreateForm} class="slds-m-left_small"></lightning-button>
                </div>

            </div>

            <!-- No Data -->
            <template if:true={noData}>
                <p class="slds-p-around_medium">No records found</p>
            </template>

            <!-- Table -->
            <template if:true={isSearchClicked}>
                <lightning-datatable
                    key-field="Id"
                    data={properties}
                    columns={columns}>
                </lightning-datatable>
            </template>

            <!-- Pagination -->
            <template if:true={isSearchClicked}>
                <div class="slds-p-around_medium">
                    <lightning-button label="Previous" onclick={previousPage} disabled={disablePrevious}></lightning-button>

                    <span class="slds-m-horizontal_small">
                        Page {pageNumber} of {totalPages}
                    </span>

                    <lightning-button label="Next" onclick={nextPage} disabled={disableNext}></lightning-button>
                </div>
            </template>

        </template>

        <!-- ================= CREATE FORM ================= -->
        <template if:true={showCreateForm}>

            <div class="slds-p-around_medium">

                <h2 class="slds-text-heading_medium">Create Property</h2>

                <!-- File Upload -->
                <lightning-file-upload
                    label="Upload Property Images (Required)"
                    multiple
                    onuploadfinished={handleUploadFinished}>
                </lightning-file-upload>

                <template if:true={imageError}>
                    <p class="slds-text-color_error">Please upload at least one image</p>
                </template>

                <!-- Form -->
                <lightning-record-edit-form
                    object-api-name="Property__c"
                    onsuccess={handleSuccess}>

                    <lightning-messages></lightning-messages>

                    <lightning-input-field field-name="Name" required></lightning-input-field>
                    <lightning-input-field field-name="Address__c" required></lightning-input-field>
                    <lightning-input-field field-name="City__c" required></lightning-input-field>
                    <lightning-input-field field-name="State__c" required></lightning-input-field>
                    <lightning-input-field field-name="Postal_Code__c" required></lightning-input-field>
                    <lightning-input-field field-name="Country__c" required></lightning-input-field>
                    <lightning-input-field field-name="Type__c" required></lightning-input-field>
                    <lightning-input-field field-name="Status__c" required></lightning-input-field>
                    <lightning-input-field field-name="Furnishing_Status__c"></lightning-input-field>
                    <lightning-input-field field-name="Rent__c" required></lightning-input-field>
                    <lightning-input-field field-name="Description__c" required></lightning-input-field>

                    <div class="slds-m-top_medium">
                        <lightning-button label="Create" variant="brand" onclick={handleCreate}></lightning-button>
                        <lightning-button label="Cancel" class="slds-m-left_small" onclick={closeCreateForm}></lightning-button>
                    </div>

                </lightning-record-edit-form>

            </div>

        </template>

    </lightning-card>
</template>
